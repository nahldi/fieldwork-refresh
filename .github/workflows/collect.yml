name: Fieldwork job refresh

on:
  workflow_dispatch:
  schedule:
    # Every five minutes throughout the day (CDT), away from the top of the hour.
    - cron: '3-58/5 * * * *'

permissions:
  contents: write

concurrency:
  group: fieldwork-job-collector
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Refresh recent searches
        env:
          REFRESH_TOKEN: ${{ secrets.FIELDWORK_REFRESH_TOKEN }}
          STATUS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          (async () => {
            if (!process.env.REFRESH_TOKEN) throw new Error('Collector credential is not configured');
            let searches = 0, jobs = 0;
            for (let attempt = 0; attempt < 4; attempt++) {
              const response = await fetch('https://j.smurly.chatgpt.site/api/jobs/collect', {
                method: 'POST',
                headers: { Authorization: `Bearer ${process.env.REFRESH_TOKEN}` },
                signal: AbortSignal.timeout(45000),
              });
              const result = await response.json();
              if (!response.ok) throw new Error(`Collector returned ${response.status}`);
              if (!result.processed) break;
              searches++;
              jobs += result.jobs ?? 0;
            }
            console.log(JSON.stringify({ searchesChecked: searches, postingsReceived: jobs }));
            // A small monthly health record documents operation and keeps this active repository's schedule enabled.
            const statusUrl = `https://api.github.com/repos/${process.env.REPOSITORY}/contents/collector-status.json`;
            const headers = { Authorization: `Bearer ${process.env.STATUS_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
            const existing = await fetch(statusUrl, { headers, signal: AbortSignal.timeout(10000) });
            let sha, checkedAt = 0;
            if (existing.ok) {
              const file = await existing.json();
              sha = file.sha;
              const status = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              checkedAt = Date.parse(status.lastVerifiedAt);
            } else if (existing.status !== 404) throw new Error('Could not read collector health record');
            if (!Number.isFinite(checkedAt) || Date.now() - checkedAt > 28 * 86400000) {
              const status = { lastVerifiedAt: new Date(Date.now() - 5 * 3600000).toISOString().replace('Z', '-05:00'), timezone: 'CDT', schedule: 'Every five minutes', site: 'https://j.smurly.chatgpt.site' };
              const saved = await fetch(statusUrl, { method: 'PUT', headers, body: JSON.stringify({ message: 'Record collector health', content: Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}) }), signal: AbortSignal.timeout(10000) });
              if (!saved.ok) throw new Error('Could not save collector health record');
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
